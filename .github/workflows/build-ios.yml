name: Build iOS App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Build iOS Archive
        run: |
          cd ios
          xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Release -destination "generic/platform=iOS" -derivedDataPath build archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
